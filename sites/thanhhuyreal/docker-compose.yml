services:
  k6:
    image: grafana/k6:latest
    env_file:
      - .env
    # Proxy: uncomment environment block bên dưới nếu cần dùng proxy
    # environment:
    #   - http_proxy=${HTTP_PROXY}
    #   - https_proxy=${HTTPS_PROXY}
    #   - no_proxy=${NO_PROXY}
    volumes:
      - ./test-script.js:/scripts/test-script.js:ro
    command: run --no-usage-report /scripts/test-script.js
    restart: always
    stop_grace_period: 120s
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "3"
    ulimits:
      nofile:
        soft: 131072
        hard: 131072
