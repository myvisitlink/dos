name: K6 Login Load Test

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL API (khong co / o cuoi)'
        required: true
        default: 'https://mice.3nestinvest.com/api/v1'
      vus:
        description: 'So Virtual Users'
        required: true
        default: '50'
      duration:
        description: 'Thoi gian giu tai moi phase'
        required: true
        default: '5m'
      request_delay:
        description: 'Nghi giua cac request (giay)'
        required: true
        default: '1'

jobs:
  # 6 phase tuan tu. Luu y: GitHub Actions gioi han 6h/job.
  load_test:
    name: Phase ${{ matrix.phase }} / 6
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      max-parallel: 1
      matrix:
        phase: [1, 2, 3, 4, 5, 6]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup k6
        uses: grafana/setup-k6-action@v1

      - name: Run k6 for Phase ${{ matrix.phase }}
        run: k6 run sites/nestinvest/test-script.js
        env:
          BASE_URL: ${{ github.event.inputs.base_url }}
          VUS: ${{ github.event.inputs.vus }}
          DURATION: ${{ github.event.inputs.duration }}
          REQUEST_DELAY: ${{ github.event.inputs.request_delay }}
