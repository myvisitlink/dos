name: HTTP Flood — thanhhuyreal

on:
  workflow_dispatch:
    inputs:
      target_url:
        description: 'Target URL (de trong dung .env)'
        required: false
        default: ''
      runners:
        description: 'So runner song song (moi runner = 1 IP Azure khac nhau)'
        required: true
        default: '1'
      duration:
        description: 'Override thoi gian giu tai VD: 5m, 30m (de trong dung STAGES trong .env)'
        required: false
        default: ''

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}
    steps:
      - id: set-matrix
        run: |
          COUNT=${{ github.event.inputs.runners }}
          MATRIX=$(python3 -c "import json; print(json.dumps(list(range(1, int('$COUNT')+1))))")
          echo "matrix=$MATRIX" >> $GITHUB_OUTPUT

  flood:
    needs: prepare
    name: "Runner ${{ matrix.runner }}"
    runs-on: ubuntu-latest
    timeout-minutes: 720
    strategy:
      fail-fast: false
      max-parallel: 20
      matrix:
        runner: ${{ fromJson(needs.prepare.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup k6 (native, khong Docker)
        uses: grafana/setup-k6-action@v1

      - name: Tang ulimit (giong VPS)
        run: |
          ulimit -n 131072
          echo "ulimit -n: $(ulimit -n)"

      - name: Runner info
        run: |
          echo "=== Runner ${{ matrix.runner }} ==="
          echo "Hostname : $(hostname)"
          echo "Public IP: $(curl -sf https://api.ipify.org || echo unknown)"
          echo "CPU cores: $(nproc)"
          echo "RAM free : $(free -m | awk '/Mem:/{print $4}') MB"

      - name: Load .env va chay k6
        run: |
          set -a
          source sites/thanhhuyreal/.env
          set +a

          # Override neu co input
          [ -n "${{ github.event.inputs.target_url }}" ] && export TARGET_URL="${{ github.event.inputs.target_url }}"
          [ -n "${{ github.event.inputs.duration }}" ]   && export STAGES="${STAGES%,*},${{ github.event.inputs.duration }}:${MAX_VUS},10s:0"

          echo "TARGET_URL       = $TARGET_URL"
          echo "STAGES           = $STAGES"
          echo "MAX_VUS          = $MAX_VUS"
          echo "REQUEST_TIMEOUT  = $REQUEST_TIMEOUT"

          ulimit -n 131072

          k6 run --no-usage-report sites/thanhhuyreal/test-script.js
